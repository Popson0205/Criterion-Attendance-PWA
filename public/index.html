<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Criterion Amazing College — Attendance</title>
<meta name="theme-color" content="#0B3D24">
<meta name="description" content="Geofenced sign in / sign out for Criterion Amazing College staff.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <!-- ===== TOP BAR (no admin entry here — admin lives at /admin) ===== -->
  <header class="topbar">
    <img src="icons/icon-192.png" alt="" class="topbar-crest">
    <div class="topbar-text">
      <span class="topbar-school">CRITERION AMAZING COLLEGE</span>
      <span class="topbar-sub">Osogbo · Staff Attendance</span>
    </div>
  </header>

  <!-- ===== HOME / CLOCK SCREEN ===== -->
  <section id="screen-home" class="screen active">
    <div class="clock-block">
      <div id="clockTime" class="clock-time">--:--</div>
      <div id="clockDate" class="clock-date">Loading date…</div>
    </div>

    <div id="geoStatus" class="geo-pill geo-checking">
      <span class="geo-dot"></span>
      <span id="geoStatusText">Checking your location…</span>
    </div>

    <div id="fenceMap" class="fence-map"></div>
    <p class="map-note">Green boundary = school perimeter fence · your position updates live.</p>

    <div class="settings-group">
      <label class="settings-label">Who are you?</label>
      <select id="staffSelect">
        <option value="">Select your name…</option>
      </select>
      <input id="staffIdDisplay" type="text" readonly placeholder="Staff ID" style="margin-top:8px;">
    </div>

    <div class="action-row">
      <button id="btnSignIn" class="action-btn action-in" disabled>
        <span class="action-icon">→</span>
        <span>Sign In</span>
      </button>
      <button id="btnSignOut" class="action-btn action-out" disabled>
        <span class="action-icon">←</span>
        <span>Sign Out</span>
      </button>
    </div>

    <button id="btnTodayLog" class="link-btn">View today's sign-ins</button>
  </section>

  <!-- ===== RESULT SCREEN ===== -->
  <section id="screen-result" class="screen">
    <div class="result-card">
      <div id="resultIcon" class="result-icon">✓</div>
      <h2 id="resultTitle">Signed in</h2>
      <p id="resultSub">Welcome, Name</p>
      <div id="resultTime" class="result-time">08:03 AM</div>
      <div id="resultBadge" class="result-badge" hidden></div>
      <button class="primary-btn" data-back="home">Done</button>
    </div>
  </section>

  <!-- ===== TODAY LOG (read-only, no login) ===== -->
  <section id="screen-todaylog" class="screen">
    <div class="screen-header">
      <button class="back-btn" data-back="home">‹</button>
      <h2>Today's Sign-Ins</h2>
    </div>
    <div id="todayLogList" class="log-list"></div>
    <p id="todayLogEmpty" class="empty-note" hidden>No sign-ins recorded yet today.</p>
  </section>

  <!-- toast -->
  <div id="toast" class="toast" hidden></div>

</div>

<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
